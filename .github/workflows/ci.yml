name: Rust CI
on:
  workflow_call:
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: nightly
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-sort@2.1.3
      - uses: taiki-e/install-action@v2.88.0
        with:
          tool: cargo-machete
      - uses: Swatinem/rust-cache@v2.9.3
      - name: clippy
        run: cargo clippy --all --all-targets --all-features
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: cargo-sort
        run: cargo sort --check --no-format -o package,lib,bin,features,dependencies,dev-dependencies,lints,workspace
      - name: cargo-machete
        run: cargo machete
  test-versions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0", stable, beta]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2.9.3
      - name: Run tests (all features)
        run: cargo test --all --all-features --all-targets
      - name: Run tests (no features)
        run: cargo test --all --no-default-features --all-targets
      - name: Run doc tests
        run: cargo test --doc
      - name: Run tests (jiff)
        run: cargo test --all --no-default-features --features "jiff" --all-targets
      - name: Run tests (chrono04)
        run: cargo test --all --no-default-features --features "chrono04" --all-targets
      - name: Run tests (time03)
        run: cargo test --all --no-default-features --features "time03" --all-targets
  prek:
    name: Validate prek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: j178/prek-action@v3.1.0
      - name: Verify the workflow lockfile
        uses: j178/prek-action@v3.1.0
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          extra-args: "--hook-stage manual gh-actions-lock-verify --all-files"
  cargo-deny:
    name: cargo-deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          manifest-path: Cargo.toml
